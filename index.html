<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Lab</title>
    <!--  Favicon usando png -->
    <link rel="icon" type="image/png" href="./img/favicon.png">
    <!-- Tailwind CSS (CSS Framework)-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 p-6">
    <h1 class="text-2xl font-bold mb-4">Habit Lab</h1>

    <form id="form" class="mb-4 space-y-2">
        <input id="name" placeholder="Nombre del hábito" class="border p-2 w-full">

        <select id="energy" class="border p-2 w-full">
            <option>Alta</option>
            <option>Media</option>
            <option>Baja</option>
        </select>

        <button class="bg-black text-white px-4 py-2">
            Agregar hábito
        </button>
    </form>

    <!-- Filtros -->
    <div class="mb-4 space-x-2">
        <button id="all" class="border px-2">Todos</button>
        <button id="pending" class="border px-2">Pendientes</button>
        <button id="done" class="border px-2">Completados</button>
    </div>

    <!-- Lista de hábitos -->
    <div id="lista"></div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
