<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Lab</title>
    <!--  Favicon usando png -->
    <link rel="icon" type="image/png" href="./img/favicon.png">
    <!-- Tailwind CSS (CSS Framework)-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h1>Habit Lab</h1>

    <form>
        <input id="name" placeholder="Nombre del hábito">

        <select id="energy">
            <option>Alta</option>
            <option>Media</option>
            <option>Baja</option>
        </select>

        <button>Agregar hábito</button>
    </form>

    <!-- Filtros -->
    <div>
        <button id="all">Todos</button>
        <button id="pending">Pendientes</button>
        <button id="done">Completados</button>
    </div>

    <!-- Lista de hábitos -->
    <div id="lista"></div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
